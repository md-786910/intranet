<html class="light" lang="en">
  <head>

    />

    <style>
      .material-symbols-outlined {
        font-variation-settings:
          "FILL" 0,
          "wght" 400,
          "GRAD" 0,
          "opsz" 24;
      }
      .card-shadow {
        box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.04);
      }
    </style>
  </head>
  <body
    class="bg-surface-bright font-body-md text-on-background min-h-screen flex flex-col"
  >
    <!-- Main Content Canvas -->
    <main
      class="flex-grow flex flex-col items-center justify-center px-gutter py-unit-xxl relative overflow-hidden"
    >
      <!-- Subtle Background Decorative Elements -->
      <div
        class="absolute inset-0 z-0 opacity-40 pointer-events-none overflow-hidden"
      >
        <div
          class="absolute -top-24 -right-24 w-96 h-96 bg-primary-container rounded-full blur-3xl"
        ></div>
        <div
          class="absolute -bottom-24 -left-24 w-96 h-96 bg-tertiary-container rounded-full blur-3xl"
        ></div>
      </div>
      <!-- Logo Section -->
      <div class="mb-unit-xl z-10 text-center">
        <div class="flex items-center justify-center gap-unit-sm mb-unit-xs">
          <div
            class="w-10 h-10 bg-on-surface flex items-center justify-center rounded-lg shadow-sm"
          >
            <span
              class="material-symbols-outlined text-white text-2xl"
              data-icon="hub"
              >hub</span
            >
          </div>
          <h1 class="font-h1 text-h1 text-on-surface tracking-tighter">
            BrightNOW
          </h1>
        </div>
      </div>
      <!-- Login Card -->
      <div
        class="w-full max-w-md bg-surface-container-lowest border border-outline-variant rounded-xl card-shadow p-unit-xl z-10"
      >
        <div class="mb-unit-lg">
          <h2 class="font-h2 text-h2 text-on-surface mb-unit-xs">Login</h2>
          <p class="font-body-md text-body-md text-on-surface-variant">
            Enter your credentials to continue
          </p>
        </div>
        <form class="space-y-unit-lg">
          <!-- Corporate Email -->
          <div class="space-y-unit-sm">
            <label
              class="font-label-caps text-label-caps text-on-surface-variant uppercase"
              for="email"
              >Corporate Email</label
            >
            <div class="relative">
              <span
                class="material-symbols-outlined absolute left-unit-md top-1/2 -translate-y-1/2 text-outline"
                data-icon="mail"
                >mail</span
              >
              <input
                class="w-full pl-11 pr-unit-md py-3 bg-surface-container-low border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary-container focus:border-primary border-0 transition-all font-body-md"
                id="email"
                placeholder="name@company.com"
                type="email"
              />
            </div>
          </div>
          <!-- Password -->
          <div class="space-y-unit-sm">
            <div class="flex justify-between items-center">
              <label
                class="font-label-caps text-label-caps text-on-surface-variant uppercase"
                for="password"
                >Password</label
              >
              <a
                class="text-body-sm font-medium text-primary hover:underline"
                href="#"
                >Forgot?</a
              >
            </div>
            <div class="relative">
              <span
                class="material-symbols-outlined absolute left-unit-md top-1/2 -translate-y-1/2 text-outline"
                data-icon="lock"
                >lock</span
              >
              <input
                class="w-full pl-11 pr-unit-md py-3 bg-surface-container-low border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary-container focus:border-primary border-0 transition-all font-body-md"
                id="password"
                placeholder="••••••••"
                type="password"
              />
            </div>
          </div>
          <!-- Keep me signed in -->
          <div class="flex items-center gap-unit-sm">
            <input
              class="w-5 h-5 rounded border-outline-variant text-primary focus:ring-primary-container"
              id="remember"
              type="checkbox"
            />
            <label
              class="font-body-sm text-body-sm text-on-surface-variant select-none"
              for="remember"
              >Keep me signed in</label
            >
          </div>
          <!-- Submit Button -->
          <button
            class="w-full bg-primary-container hover:bg-primary text-on-primary-fixed-variant font-semibold py-4 rounded-lg transition-all card-shadow flex items-center justify-center gap-unit-sm group"
            type="submit"
          >
            <span>Continue to Workspace</span>
            <span
              class="material-symbols-outlined group-hover:translate-x-1 transition-transform"
              data-icon="arrow_forward"
              >arrow_forward</span
            >
          </button>
        </form>
        <!-- Secure Session Indicator -->
        <div
          class="mt-unit-xl pt-unit-lg border-t border-outline-variant/30 flex items-center justify-center gap-unit-sm text-body-sm text-outline"
        >
          <span
            class="material-symbols-outlined text-sm"
            data-icon="verified_user"
            >verified_user</span
          >
          <span>Encrypted, secure corporate session active</span>
        </div>
      </div>
      <!-- System Status -->
      <div
        class="mt-unit-lg flex items-center gap-unit-md z-10 px-unit-lg py-unit-sm bg-surface-container border border-outline-variant rounded-full text-body-sm text-on-surface-variant"
      >
        <div class="flex items-center gap-unit-xs">
          <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
          <span class="font-medium text-on-surface">System Status:</span>
        </div>
        <span>All nodes operational</span>
        <div class="w-[1px] h-3 bg-outline-variant"></div>
        <span>v.2.4.1</span>
      </div>
    </main>
    <!-- Footer: Shared Component Design Pattern -->
    <footer
      class="w-full border-t border-outline-variant bg-surface-container-lowest"
    >
      <div
        class="max-w-7xl mx-auto px-8 py-4 flex flex-col md:flex-row justify-between items-center gap-unit-md"
      >
        <div class="text-body-sm text-outline">
          © 2024 BrightNOW Team Portal. All rights reserved.
        </div>
        <div class="flex gap-unit-xl">
          <a
            class="text-body-sm text-outline hover:text-primary hover:underline transition-all"
            href="#"
            >Support</a
          >
          <a
            class="text-body-sm text-outline hover:text-primary hover:underline transition-all"
            href="#"
            >Privacy Policy</a
          >
          <a
            class="text-body-sm text-outline hover:text-primary hover:underline transition-all"
            href="#"
            >Terms of Service</a
          >
        </div>
        <!-- Background images referenced per task instructions -->

          />
          <img
            data-alt="An abstract visualization of digital connectivity and data flow, using fine glowing lines and geometric patterns against a pristine white background. The style is futuristic yet grounded, emphasizing clarity and technological precision in a light-mode aesthetic. High-key lighting creates a sense of openness."
            src="https://lh3.googleusercontent.com/aida/ADBb0ugLzfJNkTdE8IV8swSSJk3BuDAb1zMuWtDsAIjRp5dzrNCOW6hZAt-cHQWg7p2EmWYgNddEiaLTGVDtKp5ewEzUFpkyM2k5dgcehEukbDcHoS8EVUo7rmdzcCnCh5eYvUbn5nt4LzO4awWb39Vvr909bFrJ-NRsXeVplgZBtx4nIJvj21T5JkKA7j0G8GN0ncWNjFg32EYSDj07DDlad2dvHa5laTVXVdXa4BRMSI6J6MRuisqJvxz0qKrTd3GZ2i43zq2DUeM_tw"

            src="https://lh3.googleusercontent.com/aida/ADBb0uj52QXmpGEP4GUw_4_H3TVTbsxwNgu-kuNxXLN7W1LHGdOmNr0E2R7bVm0kC3qZjUdkH0B9M9BKPK3heMxRzj2g6Zm6jpM4JtHHIAZjuAisCuPlrGo1SsecvlUkotc8MXmvZxaAOgdaAht4pXhtn6yachCgFpMBMSt7ppNahDrp1Qt3UdLw8WTxBkQ0oJBycU0ya5c4z6o_qR9kyruaAMdpeZdH8Vc7EFdhmduTVd0tnYjV0YRijW4pUtH7iXgiSRKouOx-JBvGwQ"

      </div>
    </footer>
  </body>
