services:
  # ---------- PostgreSQL ----------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-brighthouse}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-brighthouse}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bh_network

  # ---------- Redis ----------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bh_network

  # ---------- Backend API ----------
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: development
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    volumes:
      - ./server/src:/app/src
      - ./server/package.json:/app/package.json
      - ./server/src/database/migrations:/app/src/database/migrations
      - ./server/src/database/seeders:/app/src/database/seeders
      - ./.env:/app/.env:ro
      - ./server/uploads:/app/uploads
      - server_node_modules:/app/node_modules
    networks:
      - bh_network
volumes:
  pg_data:
    driver: local
  redis_data:
    driver: local
  server_node_modules:
    driver: local
  client_employee_node_modules:
    driver: local

networks:
  bh_network:
    driver: bridge
