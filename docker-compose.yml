services:
  # ---------- PostgreSQL ----------
  postgres:
    image: postgres:16-alpine
    container_name: bh_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-brighthouse}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-brighthouse}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bh_network

  # ---------- Redis ----------
  redis:
    image: redis:7-alpine
    container_name: bh_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bh_network

  # ---------- Backend API ----------
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: development
    container_name: bh_server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-4000}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-brighthouse}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-5}
      OWNER_EMAIL: ${OWNER_EMAIL:-owner@brighthouse.local}
      OWNER_PASSWORD: ${OWNER_PASSWORD:-ChangeMe123!}
      OWNER_FIRST_NAME: ${OWNER_FIRST_NAME:-Platform}
      OWNER_LAST_NAME: ${OWNER_LAST_NAME:-Owner}
    ports:
      - "${PORT:-4000}:${PORT:-4000}"
    volumes:
      - ./server/src:/app/src
      - ./server/package.json:/app/package.json
      - ./server/src/database/migrations:/app/src/database/migrations
      - ./server/src/database/seeders:/app/src/database/seeders
      - ./.env:/app/.env:ro
      - server_uploads:/app/uploads
      - server_node_modules:/app/node_modules
    networks:
      - bh_network

volumes:
  pg_data:
    driver: local
  redis_data:
    driver: local
  server_uploads:
    driver: local
  server_node_modules:
    driver: local

networks:
  bh_network:
    driver: bridge
